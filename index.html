<style>
:root {
  /* ── IRONWORKS palette: oil-black + rust + flag navy (Texan industrial) ── */
  --bg:#0b0d0f; --bg-elev:#13171a; --bg-card:#191e22; --bg-input:#222830;
  --border:#2c333a; --border-strong:#3d454e;
  --text:#f3ece0; --text-dim:#8d949c; --text-faint:#575f68;
  --accent:#d1512b; --accent-dim:#a13d1f; --accent-bg:rgba(209,81,43,0.09);
  --warn:#e3922f; --danger:#c8102e; --blue:#3f6fa8; --purple:#8d6bb5; --good:#63a375;
  --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
  --ink:#0b0d0f;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--text); font-family:'Manrope',-apple-system,sans-serif; overscroll-behavior:none; min-height:100vh; }
body { padding-top:var(--safe-top); padding-bottom:var(--safe-bot); max-width:540px; margin:0 auto; position:relative; }
/* subtle brushed-metal grain on the base */
body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.5;
  background:radial-gradient(1200px 500px at 50% -10%, rgba(209,81,43,0.07), transparent 62%); }
#app, .tab-bar, .toast, .rest-overlay, .pr-flash { position:relative; z-index:1; }

/* ── program switch ── */
.header-program { display:flex; gap:3px; margin-left:6px; }
.program-btn { padding:4px 6px; border:1px solid var(--border); border-radius:3px; color:var(--text-faint);
  font-family:'JetBrains Mono',monospace; font-size:8px; font-weight:700; letter-spacing:.06em; }
.program-btn.active { color:var(--text); border-color:var(--accent-dim); background:var(--accent-bg); }
.program-btn:active { background:var(--bg-input); }
.program-banner { margin-bottom:12px; padding:9px 11px; border:1px solid var(--border);
  border-left:3px solid var(--accent); background:var(--bg-elev); color:var(--text-faint);
  font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.06em; }
.program-banner b { color:var(--accent); }
@media (max-width:390px) { .header-program { margin-left:2px; } .program-btn { padding:4px 4px; font-size:7.5px; } }

button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input, textarea, select { font-family:inherit; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
@keyframes slideUp { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0); opacity:1; } }
@keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
@keyframes popIn { 0% { transform:scale(0.85); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes barGrow { from { transform:scaleY(0); } to { transform:scaleY(1); } }

/* ── HEADER ── */
header { padding:18px 20px 10px; position:sticky; top:var(--safe-top); background:linear-gradient(180deg,var(--bg) 78%,transparent); z-index:50; display:flex; justify-content:space-between; align-items:center; }
.logo { font-family:'Oswald',sans-serif; font-weight:600; font-size:23px; letter-spacing:0.14em; text-transform:uppercase; }
.logo span { color:var(--accent); }
.logo .star { width:15px; height:15px; fill:var(--accent); margin-right:8px; vertical-align:-1px; filter:drop-shadow(0 0 6px rgba(209,81,43,0.45)); }
.header-right { display:flex; align-items:center; gap:10px; }
.header-meta { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.12em; }
.streak-badge { background:var(--accent-bg); border:1px solid var(--accent-dim); border-radius:8px; padding:5px 10px; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--accent); letter-spacing:0.06em; display:flex; align-items:center; gap:5px; font-weight:500; }

/* ── SCREENS ── */
.screen { padding:0 20px 52px; animation:fadeIn 0.22s ease; }

/* ── JOURNEY HERO (bodyweight cut on home) ── */
.journey { background:linear-gradient(155deg,#1a2026 0%,#171c20 55%,#1e1410 100%); border:1px solid var(--border); border-radius:18px; padding:18px 18px 14px; margin-bottom:16px; position:relative; overflow:hidden; }
.journey::after { content:''; position:absolute; right:-30px; top:-30px; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle,rgba(209,81,43,0.14),transparent 70%); pointer-events:none; }
.journey-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; position:relative; }
.journey-eyebrow { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.16em; }
.journey-tag { font-family:'JetBrains Mono',monospace; font-size:8px; color:var(--accent); text-transform:uppercase; letter-spacing:0.12em; border:1px solid var(--accent-dim); border-radius:6px; padding:3px 7px; background:var(--accent-bg); }
.journey-figures { display:flex; align-items:baseline; gap:10px; }
.journey-current { font-family:'Oswald',sans-serif; font-weight:700; font-size:52px; line-height:0.9; color:var(--text); }
.journey-unit { font-family:'Oswald',sans-serif; font-weight:400; font-size:18px; color:var(--text-dim); letter-spacing:0.06em; }
.journey-delta { font-family:'Oswald',sans-serif; font-weight:600; font-size:22px; color:var(--accent); line-height:1; }
.journey-delta small { display:block; font-family:'JetBrains Mono',monospace; font-size:8px; color:var(--text-dim); letter-spacing:0.1em; text-transform:uppercase; margin-top:3px; font-weight:400; }
.journey-spark { display:flex; align-items:flex-end; gap:2px; height:34px; margin:12px 0 4px; }
.journey-spark div { flex:1; background:linear-gradient(180deg,var(--accent-dim),rgba(209,81,43,0.25)); border-radius:2px 2px 0 0; min-height:3px; transform-origin:bottom; animation:barGrow 0.5s ease backwards; }
.journey-foot { display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-faint); letter-spacing:0.06em; }

/* ── WEEKLY VOLUME CARD ── */
.vol-card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:16px 16px 14px; margin-bottom:18px; }
.vol-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.vol-label { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); letter-spacing:0.04em; width:82px; flex-shrink:0; text-transform:uppercase; }
.vol-bar-wrap { flex:1; height:8px; background:var(--bg-input); border-radius:4px; overflow:hidden; }
.vol-bar { height:100%; border-radius:4px; transition:width 0.5s ease; min-width:3px; }
.vol-sets { font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; color:var(--text); width:24px; text-align:right; flex-shrink:0; }
.vol-foot { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-faint); letter-spacing:0.04em; margin-top:10px; text-align:center; }

/* ── DASHBOARD STATS ROW ── */
.stat-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px; }
.stat-box { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:13px 8px; text-align:center; }
.stat-box-val { font-family:'Oswald',sans-serif; font-weight:600; font-size:24px; color:var(--text); line-height:1; margin-bottom:4px; }
.stat-box-val.accent { color:var(--accent); }
.stat-box-val.warn { color:var(--warn); }
.stat-box-val.blue { color:var(--blue); }
.stat-box-lbl { font-family:'JetBrains Mono',monospace; font-size:8px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.1em; }

/* ── SECTION LABEL ── */
.section-eyebrow { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.18em; margin:2px 2px 10px; display:flex; align-items:center; gap:8px; }
.section-eyebrow::after { content:''; flex:1; height:1px; background:var(--border); }

/* ── DAY CARDS ── */
.day-list { display:flex; flex-direction:column; gap:8px; }
.day-card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:15px 18px; display:flex; justify-content:space-between; align-items:center; text-align:left; width:100%; transition:transform 0.1s,border-color 0.2s; position:relative; overflow:hidden; }
.day-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent; transition:background 0.2s; }
.day-card:active { transform:scale(0.985); }
.day-card.today { border-color:var(--accent-dim); background:linear-gradient(120deg,#191e22 0%,#231610 100%); }
.day-card.today::before { background:var(--accent); }
.day-card.rest { opacity:0.5; }
.day-card.done::before { background:var(--good); }
.day-card-left { display:flex; flex-direction:column; gap:3px; }
.day-label { font-family:'JetBrains Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:0.15em; color:var(--text-dim); }
.day-card.today .day-label { color:var(--accent); }
.day-title { font-family:'Oswald',sans-serif; font-weight:600; font-size:22px; letter-spacing:0.03em; line-height:1; text-transform:uppercase; }
.day-subtitle { font-size:11px; color:var(--text-dim); margin-top:2px; }
.day-right { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
.day-arrow { color:var(--text-faint); font-size:19px; }
.day-card.today .day-arrow { color:var(--accent); }
.day-vol { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-faint); }

/* ── TAB BAR ── */
.tab-bar { position:sticky; bottom:0; background:rgba(11,13,15,0.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--border); display:flex; padding:8px 8px calc(8px + var(--safe-bot)); gap:2px; z-index:40; }
.tab { flex:1; padding:8px 4px; border-radius:10px; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); transition:all 0.15s; text-align:center; }
.tab.active { background:var(--bg-card); color:var(--accent); }
.tab svg { display:block; margin:0 auto 3px; width:17px; height:17px; }

/* ── SUB HEADER ── */
.sub-header { display:flex; align-items:center; padding:6px 20px 14px; gap:12px; }
.back-btn { width:34px; height:34px; border-radius:10px; background:var(--bg-card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.sub-header-title { font-family:'Oswald',sans-serif; font-weight:600; font-size:23px; letter-spacing:0.03em; flex:1; line-height:1.05; text-transform:uppercase; }
.sub-header-meta { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; white-space:nowrap; }

/* ── FOCUS NOTE ── */
.focus-note { font-size:12.5px; color:var(--text-dim); line-height:1.55; background:var(--bg-elev); border-left:2px solid var(--accent); padding:11px 14px; border-radius:0 8px 8px 0; margin-bottom:14px; }

/* ── EXERCISE CARDS ── */
.exercise-list { display:flex; flex-direction:column; gap:8px; }
.exercise-card-wrap { position:relative; }
.ex-controls { position:absolute; top:8px; right:8px; display:flex; flex-direction:column; gap:4px; z-index:2; }
.ex-reorder { width:26px; height:26px; border-radius:8px; background:var(--accent-bg); border:1px solid var(--accent-dim); color:var(--accent); font-size:13px; display:flex; align-items:center; justify-content:center; line-height:1; }
.ex-reorder:active { background:rgba(209,81,43,0.22); }
.ex-reorder:disabled { opacity:0.25; }
.exercise-remove { width:26px; height:26px; border-radius:8px; background:rgba(224,88,82,0.1); border:1px solid rgba(224,88,82,0.25); color:var(--danger); font-size:16px; display:flex; align-items:center; justify-content:center; }
.exercise-remove:active { background:rgba(224,88,82,0.22); }
.exercise-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:14px 44px 14px 14px; text-align:left; width:100%; transition:border-color 0.2s; }
.exercise-card.logged { border-color:var(--good); }
.exercise-card.pr { border-color:var(--accent); }
.ex-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
.exercise-name { font-family:'Manrope',sans-serif; font-size:15px; font-weight:700; line-height:1.2; flex:1; letter-spacing:-0.01em; }
.ex-badges { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
.ex-badge { font-family:'JetBrains Mono',monospace; font-size:8px; padding:2px 6px; border-radius:5px; letter-spacing:0.05em; text-transform:uppercase; }
.ex-badge.muscle { background:rgba(209,81,43,0.1); color:var(--accent); border:1px solid rgba(209,81,43,0.22); }
.ex-badge.equip { background:rgba(63,111,168,0.08); color:var(--blue); border:1px solid rgba(63,111,168,0.2); }
.ex-badge.diff-easy { background:rgba(95,191,138,0.08); color:var(--good); border:1px solid rgba(95,191,138,0.2); }
.ex-badge.diff-med { background:rgba(239,144,64,0.08); color:var(--warn); border:1px solid rgba(239,144,64,0.2); }
.ex-badge.diff-hard { background:rgba(224,88,82,0.08); color:var(--danger); border:1px solid rgba(224,88,82,0.2); }
.exercise-target { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); letter-spacing:0.03em; }
.exercise-target b { color:var(--text); font-weight:500; }
.exercise-last { margin-top:7px; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--accent); letter-spacing:0.02em; opacity:0.85; }
.ex-orm { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--warn); margin-top:3px; }
.ex-next { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--good); margin-top:5px; letter-spacing:0.02em; font-weight:500; }
.ex-badge.weak { background:rgba(209,81,43,0.16); color:var(--accent); border:1px solid var(--accent); font-weight:700; }
.exercise-card.weak-pt { border-left:3px solid var(--accent); }
.pr-tag { font-family:'Oswald',sans-serif; font-weight:600; font-size:11px; color:var(--accent); letter-spacing:0.08em; margin-left:6px; animation:pulse 1.5s ease-in-out infinite; }

/* ── ADD EXERCISE BTN ── */
.add-exercise-btn { width:100%; margin-top:14px; padding:14px; background:transparent; border:1.5px dashed var(--border-strong); border-radius:12px; color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-weight:500; transition:border-color 0.2s,background 0.2s; }
.add-exercise-btn:active { background:var(--bg-card); border-color:var(--accent); }

/* ── PICKER ── */
.picker-search-wrap { position:sticky; top:calc(var(--safe-top) + 54px); z-index:30; background:var(--bg); padding:0 0 12px; }
.picker-search { width:100%; background:var(--bg-input); border:1px solid var(--border-strong); border-radius:10px; padding:12px 14px; color:var(--text); font-size:14px; }
.picker-search:focus { outline:none; border-color:var(--accent); }
.picker-filters { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.picker-filters::-webkit-scrollbar { display:none; }
.filter-chip { padding:5px 11px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; font-size:11px; color:var(--text-dim); white-space:nowrap; flex-shrink:0; }
.filter-chip.on { background:var(--accent-bg); color:var(--accent); border-color:var(--accent-dim); }
.picker-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; text-align:left; width:100%; display:flex; align-items:center; gap:10px; transition:border-color 0.15s; }
.picker-card.picker-active { border-color:var(--accent-dim); background:linear-gradient(120deg,#191e22 0%,#231610 100%); }
.picker-card-main { flex:1; min-width:0; }
.picker-card-state { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); white-space:nowrap; }
.picker-card.picker-active .picker-card-state { color:var(--accent); }
.picker-section-label { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.16em; padding:14px 0 6px; }

/* ── LOG SCREEN ── */
.log-target { background:var(--bg-elev); border-radius:12px; padding:12px 14px; margin-bottom:16px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); border:1px solid var(--border); }
.log-target b { color:var(--accent); }
.log-prev-sets { font-size:10px; color:var(--text-faint); margin-top:4px; }
.set-header { display:grid; grid-template-columns:32px 1fr 1fr 52px; gap:6px; margin-bottom:6px; font-family:'JetBrains Mono',monospace; font-size:8px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.12em; text-align:center; }
.set-row { display:grid; grid-template-columns:32px 1fr 1fr 52px; gap:6px; align-items:center; margin-bottom:6px; }
.set-num { font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; color:var(--text-dim); text-align:center; }
.set-input { background:var(--bg-input); border:1px solid var(--border); border-radius:10px; padding:13px 10px; font-size:16px; color:var(--text); font-family:'JetBrains Mono',monospace; width:100%; text-align:center; transition:border-color 0.15s; }
.set-input:focus { outline:none; border-color:var(--accent); }
.set-input::placeholder { color:var(--text-faint); }
.set-actions { display:flex; gap:4px; align-items:center; justify-content:center; }
.set-remove { color:var(--text-faint); font-size:18px; width:24px; height:36px; display:flex; align-items:center; justify-content:center; }
.rest-btn { width:26px; height:26px; border-radius:7px; background:var(--bg-card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--blue); font-size:13px; }
.add-set { width:100%; padding:11px; background:transparent; border:1px dashed var(--border-strong); border-radius:10px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; margin-top:6px; }
.notes-input { width:100%; background:var(--bg-input); border:1px solid var(--border); border-radius:10px; padding:11px 13px; color:var(--text); font-size:13px; margin-top:16px; resize:vertical; min-height:56px; }
.notes-input:focus { outline:none; border-color:var(--accent); }
.save-btn { width:100%; padding:16px; background:var(--accent); color:var(--ink); border-radius:12px; font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; letter-spacing:0.1em; text-transform:uppercase; margin-top:20px; transition:transform 0.1s; }
.save-btn:active { transform:scale(0.98); }

/* ── BODY WEIGHT ── */
.bw-row { display:flex; gap:8px; margin-bottom:16px; }
.bw-input { flex:1; background:var(--bg-input); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--text); font-size:16px; font-family:'JetBrains Mono',monospace; }
.bw-input:focus { outline:none; border-color:var(--accent); }
.bw-save { padding:12px 18px; background:var(--accent); color:var(--ink); border-radius:10px; font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; letter-spacing:0.08em; text-transform:uppercase; }
.bw-history { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
.bw-entry { display:flex; justify-content:space-between; align-items:center; padding:9px 12px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:11px; }
.bw-del { color:var(--text-faint); font-size:16px; }

/* ── HISTORY ── */
.history-filter-row { display:flex; gap:6px; overflow-x:auto; padding:0 0 12px; scrollbar-width:none; margin-bottom:4px; }
.history-filter-row::-webkit-scrollbar { display:none; }
.session-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:13px 14px; margin-bottom:8px; }
.session-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.session-day { font-family:'Oswald',sans-serif; font-weight:600; font-size:18px; color:var(--accent); letter-spacing:0.03em; text-transform:uppercase; }
.session-date { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); }
.session-vol { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-faint); margin-top:2px; }
.session-exercise { margin-top:7px; padding-top:7px; border-top:1px solid var(--border); }
.session-exercise:first-child { border-top:none; padding-top:0; }
.session-exercise-name { font-size:12px; font-weight:600; margin-bottom:3px; }
.session-sets { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); line-height:1.5; }
.session-notes { margin-top:6px; padding:6px 9px; background:var(--bg-elev); border-radius:6px; font-size:11px; color:var(--text-dim); border-left:2px solid var(--accent-dim); }
.session-delete { float:right; color:var(--danger); font-size:12px; font-family:'JetBrains Mono',monospace; opacity:0.6; padding:2px 6px; border-radius:5px; border:1px solid rgba(224,88,82,0.3); }

/* ── PROGRESS ── */
.progress-pick { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:16px; }
.chip { padding:6px 12px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; font-size:11px; color:var(--text-dim); white-space:nowrap; cursor:pointer; }
.chip.active { background:var(--accent); color:var(--ink); border-color:var(--accent); font-weight:700; }
.metric-tabs { display:flex; gap:6px; margin-bottom:14px; }
.metric-tab { flex:1; padding:9px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); text-align:center; }
.metric-tab.active { background:var(--accent-bg); color:var(--accent); border-color:var(--accent-dim); }
.chart-card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:14px; }
.chart-title { font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; letter-spacing:0.03em; margin-bottom:2px; text-transform:uppercase; }
.chart-meta { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:14px; }
.chart { width:100%; height:160px; }
.chart-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; }
.stat { background:var(--bg-elev); border-radius:8px; padding:10px 6px; text-align:center; }
.stat-label { font-family:'JetBrains Mono',monospace; font-size:8px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:4px; }
.stat-value { font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; color:var(--text); }
.stat-value.up { color:var(--good); }
.stat-value.down { color:var(--warn); }
.pr-list { margin-top:6px; }
.pr-item { display:flex; justify-content:space-between; align-items:center; padding:9px 12px; background:var(--bg-elev); border-radius:8px; margin-bottom:5px; border-left:2px solid var(--accent); }
.pr-name { font-size:12px; font-weight:600; }
.pr-val { font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; color:var(--accent); }
.pr-date { font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-faint); }

/* ── REST TIMER OVERLAY ── */
.rest-overlay { position:fixed; inset:0; background:rgba(8,9,11,0.9); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; animation:fadeIn 0.18s ease; }
.rest-ring { position:relative; width:180px; height:180px; margin-bottom:24px; }
.rest-ring svg { position:absolute; inset:0; transform:rotate(-90deg); }
.rest-ring-track { fill:none; stroke:var(--border); stroke-width:8; }
.rest-ring-prog { fill:none; stroke:var(--accent); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
.rest-time { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.rest-seconds { font-family:'Oswald',sans-serif; font-weight:600; font-size:56px; color:var(--text); line-height:1; }
.rest-label { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.15em; }
.rest-controls { display:flex; gap:12px; }
.rest-ctrl-btn { padding:12px 22px; border-radius:12px; font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; letter-spacing:0.08em; text-transform:uppercase; }
.rest-ctrl-btn.skip { background:var(--accent); color:var(--ink); }
.rest-ctrl-btn.adj { background:var(--bg-card); color:var(--text); border:1px solid var(--border); }
.rest-dur-label { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); margin-bottom:14px; text-align:center; }

/* ── PR FLASH ── */
.pr-flash { position:fixed; top:20%; left:50%; transform:translateX(-50%); z-index:300; background:var(--accent); color:var(--ink); padding:14px 24px; border-radius:14px; font-family:'Oswald',sans-serif; font-weight:700; font-size:22px; letter-spacing:0.08em; text-transform:uppercase; box-shadow:0 8px 40px rgba(209,81,43,0.45); animation:popIn 0.35s ease forwards; pointer-events:none; }

/* ── SETTINGS ── */
.settings-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:10px; }
.settings-card h3 { font-family:'Oswald',sans-serif; font-weight:600; font-size:17px; letter-spacing:0.03em; margin-bottom:5px; text-transform:uppercase; }
.settings-card p { font-size:12px; color:var(--text-dim); line-height:1.5; margin-bottom:10px; }
.danger-btn { background:transparent; border:1px solid var(--danger); color:var(--danger); padding:9px 14px; border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; }
.secondary-btn { background:transparent; border:1px solid var(--border-strong); color:var(--text); padding:9px 14px; border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; margin-right:6px; }
.settings-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
.settings-row:last-child { border-bottom:none; }
.settings-row-label { font-size:13px; font-weight:600; }
.settings-row-sub { font-size:11px; color:var(--text-dim); margin-top:2px; }
.toggle { width:44px; height:24px; border-radius:12px; background:var(--border-strong); position:relative; cursor:pointer; transition:background 0.2s; flex-shrink:0; }
.toggle.on { background:var(--accent-dim); }
.toggle::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform 0.2s; }
.toggle.on::after { transform:translateX(20px); }

function programCustomDays() {
  if (!data.customDaysByProgram) {
    data.customDaysByProgram = {
      six: data.customDays ? JSON.parse(JSON.stringify(data.customDays)) : {},
      five: {}
    };
    save(data);
  }
  if (!data.customDaysByProgram[state.program]) data.customDaysByProgram[state.program] = {};
  return data.customDaysByProgram[state.program];
}

function getExerciseById(id) {
  for (const d of Object.values(currentRoutine())) {
    const e = d.exercises.find(x => x.id === id);
    if (e) return e;
  }
  return MASTER_LIBRARY.find(x => x.id === id) || null;
}

function getDayExercises(dayKey) {
  const base = currentRoutine()[dayKey].exercises;
  const custom = (programCustomDays()[dayKey]) || {added:[],removed:[]};
  let result = base.filter(ex => !custom.removed.includes(ex.id)).slice();
  for (const addedId of custom.added) {
    const ex = getExerciseById(addedId);
    if (ex && !result.find(e => e.id === ex.id)) result.push(ex);
  }
  // Apply custom ordering if present
  if (custom.order && custom.order.length) {
    const orderMap = new Map(custom.order.map((id,i)=>[id,i]));
    result.sort((a,b)=>{
      const ai = orderMap.has(a.id)?orderMap.get(a.id):999;
      const bi = orderMap.has(b.id)?orderMap.get(b.id):999;
      return ai-bi;
    });
  }
  return result;
}
function moveExerciseInDay(dayKey, exerciseId, dir) {
  const current = getDayExercises(dayKey).map(e=>e.id);
  const idx = current.indexOf(exerciseId);
  if (idx < 0) return;
  const swap = idx + dir;
  if (swap < 0 || swap >= current.length) return;
  [current[idx], current[swap]] = [current[swap], current[idx]];
  const custom = (programCustomDays()[dayKey]) || {added:[],removed:[]};
  custom.order = current;
  setDayCustom(dayKey, custom);
}
function setDayCustom(dayKey, custom) {
  programCustomDays()[dayKey] = custom;
  save(data);
}
function addExerciseToDay(dayKey, exerciseId) {
  const custom = (programCustomDays()[dayKey]) || {added:[],removed:[]};
  if (custom.removed.includes(exerciseId)) {
    custom.removed = custom.removed.filter(id => id !== exerciseId);
  } else if (!custom.added.includes(exerciseId)) {
    custom.added.push(exerciseId);
  }
  setDayCustom(dayKey, custom);
}
function removeExerciseFromDay(dayKey, exerciseId) {
  const custom = (programCustomDays()[dayKey]) || {added:[],removed:[]};
  const base = currentRoutine()[dayKey].exercises.find(e => e.id === exerciseId);
  if (base) {
    if (!custom.removed.includes(exerciseId)) custom.removed.push(exerciseId);
  } else {
    custom.added = custom.added.filter(id => id !== exerciseId);
  }
  setDayCustom(dayKey, custom);
}

    if (storedVer !== SEED_VERSION) {
      const fresh = JSON.parse(JSON.stringify(SEED_DATA));
      if (!fresh.sessions) fresh.sessions = [];
      if (!fresh.customDays) fresh.customDays = {};
      if (!fresh.customDaysByProgram) fresh.customDaysByProgram = {six: JSON.parse(JSON.stringify(fresh.customDays)), five: {}};
      if (!fresh.bodyweight) fresh.bodyweight = [];

// ── 1RM: Epley formula ──
function calc1RM(weight, reps) {
  const w = parseFloat(weight);
  const r = parseInt(reps);
  if (!w || !r || isNaN(w) || isNaN(r) || r <= 0) return null;
  if (r === 1) return w;
  return Math.round(w * (1 + r / 30));
}

// ── Volume: sum(weight × reps) for a session's exercise ──
function calcSessionVolume(exerciseSets) {
  return exerciseSets.reduce((sum, s) => {
    const w = parseFloat(s.weight);
    const r = parseInt(s.reps);
    if (!isNaN(w) && !isNaN(r)) return sum + w * r;
    return sum;
  }, 0);
}

function totalWeeklyVolume(offsetWeeks = 0) {
  const now = new Date();
  const dayOfWeek = (now.getDay()+6)%7;
  const monday = new Date(now); monday.setDate(now.getDate() - dayOfWeek - offsetWeeks*7);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const mStr = monday.toISOString().slice(0,10);
  const sStr = sunday.toISOString().slice(0,10);
  let vol = 0;
  data.sessions.forEach(s => {
    if (s.date >= mStr && s.date <= sStr) {
      s.exercises.forEach(e => { vol += calcSessionVolume(e.sets); });
    }
  });
  return Math.round(vol);
}

function currentStreak() {
  let streak = 0;
  const d = new Date();
  while (true) {
    const iso = d.toISOString().slice(0,10);
    const dayKey = DAY_ORDER[(d.getDay()+6)%7];
    const isRest = currentRoutine()[dayKey].type === 'rest';
    const logged = data.sessions.some(s => s.date === iso);
    if (!isRest && logged) { streak++; d.setDate(d.getDate()-1); }
    else if (isRest) { d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function allPRs() {
  // For each exercise, find best 1RM across all sessions
  const bests = {};
  data.sessions.forEach(s => {
    s.exercises.forEach(e => {
      e.sets.forEach(st => {
        const orm = calc1RM(st.weight, st.reps);
        if (orm && (!bests[e.exerciseId] || orm > bests[e.exerciseId].orm)) {
          bests[e.exerciseId] = {orm, date: s.date, weight: st.weight, reps: st.reps};
        }
      });
    });
  });
  return bests;
}

function checkForNewPR(exerciseId, sets) {
  const prs = allPRs();
  const prev = prs[exerciseId];
  let newBest = null;
  sets.forEach(st => {
    const orm = calc1RM(st.weight, st.reps);
    if (orm) {
      if (!prev || orm > prev.orm) {
        if (!newBest || orm > newBest) newBest = orm;
      }
    }
  });
  return newBest;
}

      </div>

    </div>`;
  document.getElementById('rest-skip').onclick = () => { clearInterval(restInterval); restInterval=null; hideRestOverlay(); };
  document.getElementById('rest-minus').onclick = () => { restRemaining = Math.max(5, restRemaining-15); updateRestOverlay(); };
  document.getElementById('rest-plus').onclick = () => { restRemaining = restRemaining+15; updateRestOverlay(); };
}
function hideRestOverlay() {
  const el = document.getElementById('rest-overlay');

}
function playBeep() {
  if (!settings.soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880; gain.gain.value = 0.3;
    osc.start(); osc.stop(ctx.currentTime + 0.18);
    setTimeout(() => { const o2 = ctx.createOscillator(); const g2 = ctx.createGain(); o2.connect(g2); g2.connect(ctx.destination); o2.frequency.value = 1100; g2.gain.value = 0.3; o2.start(); o2.stop(ctx.currentTime+0.18); }, 200);
  } catch {}
}

function journeyHero() {
  const bw = [...(data.bodyweight||[])].sort((a,b)=>a.date.localeCompare(b.date));
  if (bw.length < 2) return '';
  const start = bw[0], curr = bw[bw.length-1];
  const startW = parseFloat(start.weight), currW = parseFloat(curr.weight);
  const lost = +(startW - currW).toFixed(1);
  const down = lost > 0;
  // timeframe in weeks
  const days = Math.max(1, Math.round((new Date(curr.date)-new Date(start.date))/86400000));
  const weeks = (days/7);
  const perWeek = weeks >= 1 ? (lost/weeks).toFixed(1) : lost.toFixed(1);
  // sparkline bars scaled across weight range (taller = heavier)
  const ws = bw.map(b=>parseFloat(b.weight));
  const lo = Math.min(...ws), hi = Math.max(...ws), span = (hi-lo)||1;
  const bars = bw.map((b,i)=>{
    const h = 20 + ((parseFloat(b.weight)-lo)/span)*80;
    return `<div style="height:${h}%;animation-delay:${i*18}ms"></div>`;
  }).join('');
  const fmt = d => { const [y,m,day]=d.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+(+day); };
  return `<div class="journey">
    <div class="journey-top">
      <div>
        <div class="journey-eyebrow">Bodyweight · since ${fmt(start.date)}</div>
        <div class="journey-figures">
          <div class="journey-current">${currW}</div>
          <div class="journey-unit">lbs</div>
        </div>
      </div>
      <div style="text-align:right">
        <div class="journey-tag">Carnivore Cut</div>
        ${down?`<div class="journey-delta" style="margin-top:10px">−${lost}<small>lbs lost</small></div>`
              :`<div class="journey-delta" style="margin-top:10px;color:var(--warn)">+${Math.abs(lost)}<small>lbs</small></div>`}
      </div>
    </div>
    <div class="journey-spark">${bars}</div>
    <div class="journey-foot">
      <span>${startW} → ${currW} lbs</span>
      <span>${down?`~${perWeek} lbs/wk`:''} · ${Math.round(weeks)} wk${Math.round(weeks)===1?'':'s'}</span>
    </div>
  </div>`;
}

// Progressive overload: derive next session's target from last session's WORKING set.
// Double progression — add a rep until the top of the range, then add weight and reset.
// Anchors on the heaviest set actually performed INSIDE the rep range, so a near-max
// low-rep set (e.g. a heavy single on a 3–6 range top-out) never becomes the next target.
function progressionTarget(ex, last) {
  if (!last) return null;
  const nums = (ex.reps || '').match(/\d+/g);
  const lowEnd  = nums ? parseInt(nums[0]) : null;
  const highEnd = nums ? parseInt(nums[nums.length - 1]) : null;

  const sets = [];
  for (const s of last.ex.sets) {
    const w = parseFloat(s.weight), r = parseInt(s.reps);
    if (!isNaN(w) && !isNaN(r)) sets.push({ w, r });
  }
  if (!sets.length) return null;

  const heaviest = arr => arr.reduce((t,s) => (!t || s.w > t.w || (s.w === t.w && s.r > t.r)) ? s : t, null);
  const mostReps = arr => arr.reduce((t,s) => (!t || s.r > t.r || (s.r === t.r && s.w > t.w)) ? s : t, null);

  const any = heaviest(sets);
  if (any.w < 0 || !highEnd) return `beat ${any.w}×${any.r}`;   // assisted lift or no rep target

  const inRange = lowEnd ? sets.filter(s => s.r >= lowEnd) : sets;
  const top = inRange.length ? heaviest(inRange) : mostReps(sets);

  const inc = ex.equip === 'bodyweight' ? 0 : 5;
  if (top.r < highEnd) return `${top.w} lb × ${top.r + 1}`;   // add a rep
  if (inc > 0) return `${top.w + inc} lb × ${lowEnd}`;        // add weight, reset to bottom
  return `add reps`;
}

function renderPicker() {
  const dayKey = state.selectedDay;
  const d = currentRoutine()[dayKey];
  const active = getDayExercises(dayKey);
  const activeIds = new Set(active.map(e=>e.id));
  const custom = (data.customDays&&data.customDays[dayKey])||{added:[],removed:[]};
  const removedBase = (currentRoutine()[dayKey].exercises||[]).filter(e=>custom.removed.includes(e.id));
  // Build full pool: removed base exercises + MASTER_LIBRARY
  const pool = [...removedBase, ...MASTER_LIBRARY.filter(e=>!removedBase.find(r=>r.id===e.id))];
  // Filter
  const q = (state.pickerSearch||'').toLowerCase();
  const mf = state.pickerMuscle||'all';
  const ef = state.pickerEquip||'all';
  let filtered = pool.filter(ex => {
    if (q && !ex.name.toLowerCase().includes(q) && !(ex.muscles||[]).some(m=>m.includes(q))) return false;
    if (mf!=='all' && !(ex.muscles||[]).includes(mf)) return false;
    if (ef!=='all' && ex.equip !== ef) return false;
    return true;
  });
  // Active first, then alphabetical
  filtered.sort((a,b) => {
    const aA=activeIds.has(a.id), bA=activeIds.has(b.id);
    if (aA&&!bA) return -1; if (!aA&&bA) return 1;
    return a.name.localeCompare(b.name);
  });
  const muscleChips = MUSCLE_GROUPS.map(m=>`<button class="filter-chip ${mf===m?'on':''}" data-pfilter-muscle="${m}">${m}</button>`).join('');
  const equipChips = EQUIP_TYPES.map(e=>`<button class="filter-chip ${ef===e?'on':''}" data-pfilter-equip="${e}">${e}</button>`).join('');
  const items = filtered.map(ex => {
    const isActive = activeIds.has(ex.id);
    const muscles = (ex.muscles||[]).slice(0,2).map(m=>`<span class="ex-badge muscle">${m}</span>`).join('');
    const equipBadge = ex.equip ? `<span class="ex-badge equip">${ex.equip}</span>` : '';

        <div class="exercise-name" style="font-size:14px">${ex.name}</div>
        <div class="ex-badges" style="margin:3px 0">${muscles}${equipBadge}</div>
        <div class="exercise-target"><b>${ex.sets}</b>×<b>${ex.reps}</b> · <b>${ex.weight}</b>${ex.note?` · <span style="color:var(--text-faint)">${ex.note}</span>`:''}</div>
      </div>
      <div class="picker-card-state">${isActive?'✓ On':'+ Add'}</div>
    </button>`;
  }).join('');
  return renderHeader() + `<div class="sub-header">
    <button class="back-btn" data-back-picker>←</button>
    <div class="sub-header-title">EXERCISE LIBRARY</div>
    <div class="sub-header-meta">${filtered.length} exercises</div>
  </div><div class="screen" style="padding-top:0">
    <div class="picker-search-wrap">
      <input class="picker-search" type="search" placeholder="Search exercises..." value="${state.pickerSearch||''}" id="picker-search-input">

// ─── LOG ────────────────────────────────────────────────────
let logDraft = null;
function initLogDraft(exercise) {
  const last = lastSessionFor(exercise.id);
  if (last) {
    const sets = [];
    for (let i=0; i<exercise.sets; i++) {
      const prev = last.ex.sets[i];
      sets.push({weight: prev?.weight||'', reps: prev?.reps||''});
    }
    logDraft = {sets, notes:''};
  } else {
    logDraft = {sets: Array.from({length:exercise.sets},()=>({weight:'',reps:''})), notes:''};
  }
}
function renderLog() {
  const ex = getExerciseById(state.selectedExercise);
  if (!ex) { state.view='day'; return renderDay(); }
  if (!logDraft) initLogDraft(ex);
  const last = lastSessionFor(ex.id);
  let prevText = '';
  if (last) {
    const prevSets = last.ex.sets.map(s=>`${s.weight||'—'}×${s.reps||'—'}`).join('  ');
    prevText = `<div class="log-prev-sets">Last: ${prevSets}</div>`;
  }
  const setRows = logDraft.sets.map((s,i)=>`
    <div class="set-row">
      <div class="set-num">${i+1}</div>
      <input class="set-input" type="text" inputmode="decimal" placeholder="wt" value="${s.weight}" data-set="${i}" data-field="weight">
      <input class="set-input" type="text" inputmode="numeric" placeholder="reps" value="${s.reps}" data-set="${i}" data-field="reps">
      <div class="set-actions">
        ${settings.restTimer?`<button class="rest-btn" data-start-rest title="Start rest timer">⏱</button>`:''}
        <button class="set-remove" data-remove-set="${i}">×</button>
      </div>
    </div>`).join('');
  const orm = logDraft.sets.reduce((best,s)=>{const v=calc1RM(s.weight,s.reps);return v&&v>best?v:best;},0);
  return renderHeader() + `<div class="sub-header">
    <button class="back-btn" data-back>←</button>
    <div class="sub-header-title" style="font-size:17px;line-height:1.2">${ex.name}</div>
  </div><div class="screen">
    <div class="log-target">TARGET · <b>${ex.sets} × ${ex.reps}</b> @ <b>${ex.weight}</b>${ex.note?`<br><span style="color:var(--text-faint);font-size:10px">${ex.note}</span>`:''}${prevText}</div>
    ${orm?`<div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--warn);margin-bottom:10px">~${orm} ESTIMATED 1RM</div>`:''}
    <div class="set-header"><div>SET</div><div>WEIGHT</div><div>REPS</div><div></div></div>
    ${setRows}

function renderHistory() {
  const sorted = [...data.sessions].sort((a,b)=>b.timestamp-a.timestamp);

  </div>`;
  if (data.sessions.length===0) return renderHeader('HISTORY') + `<div class="screen">${filterChips}<div class="empty"><div class="empty-title">NO SESSIONS YET</div>Log your first workout and it'll appear here.</div></div>`;
  const cards = filtered.map(s => {
    const vol = Math.round(s.exercises.reduce((sum,e)=>sum+calcSessionVolume(e.sets),0));
    const exHtml = s.exercises.map(e => {

      const sets = e.sets.map(st=>`${st.weight||'—'}×${st.reps||'—'}`).join(' · ');
      return `<div class="session-exercise"><div class="session-exercise-name">${name}</div><div class="session-sets">${sets}</div></div>`;

        <div style="text-align:right"><div class="session-date">${s.date}</div><button class="session-delete" data-delete-session="${s.timestamp}">DELETE</button></div>
      </div>${exHtml}${s.notes?`<div class="session-notes">${s.notes}</div>`:''}

  return renderHeader('HISTORY') + `<div class="screen">${filterChips}${cards||'<div class="empty" style="padding:30px 0">No sessions match this filter.</div>'}</div>`;

// ─── PROGRESS ───────────────────────────────────────────────
function getProgressPoints(exerciseId, metric) {
  const points = [];
  data.sessions.forEach(s => {
    const e = s.exercises.find(x=>x.exerciseId===exerciseId);
    if (e) {
      const weights = e.sets.map(st=>parseFloat(st.weight)).filter(n=>!isNaN(n));
      if (!weights.length) return;
      let val;
      if (metric==='volume') { val = Math.round(calcSessionVolume(e.sets)); }
      else if (metric==='1rm') { val = e.sets.reduce((best,st)=>{const v=calc1RM(st.weight,st.reps);return v&&v>best?v:best;},0); }
      else { val = Math.max(...weights); } // topset
      if (val) points.push({date:s.date,timestamp:s.timestamp,val});
    }
  });
  return points.sort((a,b)=>a.timestamp-b.timestamp);
}
function renderProgress() {
  const logged = new Set();
  data.sessions.forEach(s=>s.exercises.forEach(e=>logged.add(e.exerciseId)));
  if (logged.size===0) return renderHeader('PROGRESS')+`<div class="screen"><div class="empty"><div class="empty-title">NO DATA YET</div>Log some sessions first.</div></div>`;
  if (!state.chartExercise||!logged.has(state.chartExercise)) state.chartExercise=[...logged][0];
  const chips = [...logged].map(id=>{
    const ex=getExerciseById(id);
    return `<button class="chip ${state.chartExercise===id?'active':''}" data-chip="${id}">${ex?.name||id}</button>`;
  }).join('');
  const metric = state.chartMetric||'topset';
  const metricTabs = ['topset','1rm','volume'].map(m=>`<button class="metric-tab ${metric===m?'active':''}" data-metric="${m}">${m==='topset'?'Top Set':m==='1rm'?'Est. 1RM':'Volume'}</button>`).join('');
  const ex = getExerciseById(state.chartExercise);
  const points = getProgressPoints(state.chartExercise, metric);
  let statsHtml = '';
  if (points.length>=1) {
    const latest=points[points.length-1], first=points[0];
    const max=points.reduce((m,p)=>p.val>m.val?p:m,points[0]);
    const delta=points.length>1?(latest.val-first.val):0;
    const pct=first.val>0?((delta/first.val)*100).toFixed(1):0;
    statsHtml=`<div class="chart-stats">
      <div class="stat"><div class="stat-label">Latest</div><div class="stat-value">${metric==='volume'?(latest.val/1000).toFixed(1)+'k':latest.val}</div></div>
      <div class="stat"><div class="stat-label">Peak</div><div class="stat-value">${metric==='volume'?(max.val/1000).toFixed(1)+'k':max.val}</div></div>
      <div class="stat"><div class="stat-label">Δ Total</div><div class="stat-value ${delta>0?'up':delta<0?'down':''}">${delta>0?'+':''}${metric==='volume'?(delta/1000).toFixed(1)+'k':delta}</div></div>
      <div class="stat"><div class="stat-label">% Gain</div><div class="stat-value ${delta>0?'up':delta<0?'down':''}">${delta>0?'+':''}${pct}%</div></div>
    </div>`;
  }
  // Top sets for this exercise — heaviest weight logged, sorted desc
  const allSetsForEx = [];
  data.sessions.forEach(s => {
    const e = s.exercises.find(x => x.exerciseId === state.chartExercise);
    if (e) {
      e.sets.forEach(st => {
        const w = parseFloat(st.weight);
        if (!isNaN(w) && w > 0) allSetsForEx.push({date: s.date, weight: w, reps: st.reps});
      });
    }
  });
  allSetsForEx.sort((a,b) => b.weight - a.weight || b.date.localeCompare(a.date));
  const topSets = allSetsForEx.slice(0, 8);
  const prHtml = topSets.length ? `<div class="chart-card">
    <div class="chart-title">HEAVIEST SETS</div>
    <div class="chart-meta" style="margin-bottom:10px">ALL TIME · ${ex?.name||state.chartExercise}</div>
    <div class="pr-list">${topSets.map((s,i) => `<div class="pr-item">
      <div><div class="pr-name" style="font-size:13px">#${i+1} — ${s.weight} lbs × ${s.reps} reps</div><div class="pr-date">${s.date}</div></div>
      <div class="pr-val">${s.weight}</div>
    </div>`).join('')}</div>
  </div>` : '';
  return renderHeader('PROGRESS')+`<div class="screen">
    <div class="progress-pick">${chips}</div>
    <div class="metric-tabs">${metricTabs}</div>
    <div class="chart-card">
      <div class="chart-title">${ex?.name||state.chartExercise}</div>
      <div class="chart-meta">${metric==='topset'?'TOP SET WEIGHT':metric==='1rm'?'ESTIMATED 1RM':'TOTAL VOLUME'} · ${points.length} session${points.length===1?'':'s'}</div>
      <svg class="chart" id="chart" viewBox="0 0 400 160" preserveAspectRatio="none"></svg>
      ${statsHtml}
    </div>${prHtml}
  </div>`;
}
function drawChart() {
  const svg = document.getElementById('chart');
  if (!svg) return;
  const metric = state.chartMetric||'topset';
  const pts = getProgressPoints(state.chartExercise, metric);
  if (!pts.length) { svg.innerHTML='<text x="200" y="80" fill="#575f68" font-size="12" text-anchor="middle" font-family="JetBrains Mono">No data yet</text>'; return; }
  const W=400,H=160,padL=36,padR=10,padT=14,padB=22;
  const ys=pts.map(p=>p.val), xs=pts.map(p=>p.timestamp);
  const minY=Math.min(...ys),maxY=Math.max(...ys),minX=Math.min(...xs),maxX=Math.max(...xs);
  const pad=(maxY-minY)*0.18;
  const yLo=Math.max(0,minY-pad), yHi=maxY+pad, yRange=yHi-yLo||1;
  const xRange=maxX-minX||1;
  const px=t=>pts.length===1?(padL+(W-padL-padR)/2):padL+((t-minX)/xRange)*(W-padL-padR);
  const py=v=>padT+(1-(v-yLo)/yRange)*(H-padT-padB);
  let grid='';
  for (let i=0;i<=3;i++) {
    const y=padT+(i/3)*(H-padT-padB);
    const rawVal=yHi-(i/3)*yRange;
    const label=metric==='volume'?(rawVal/1000).toFixed(1)+'k':Math.round(rawVal);
    grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#222830" stroke-width="1"/>`;
    grid+=`<text x="${padL-4}" y="${y+3}" fill="#575f68" font-size="8" font-family="JetBrains Mono" text-anchor="end">${label}</text>`;
  }
  let path='',area='';
  if (pts.length>1) {
    path=`M ${px(pts[0].timestamp)} ${py(pts[0].val)}`;
    pts.forEach((p,i)=>{ if(i>0) path+=` L ${px(p.timestamp)} ${py(p.val)}`; });
    area=`M ${px(pts[0].timestamp)} ${H-padB}`;
    pts.forEach(p=>area+=` L ${px(p.timestamp)} ${py(p.val)}`);
    area+=` L ${px(pts[pts.length-1].timestamp)} ${H-padB} Z`;
  }
  const dots=pts.map(p=>`<circle cx="${px(p.timestamp)}" cy="${py(p.val)}" r="4" fill="#d1512b" stroke="#0b0d0f" stroke-width="2"/>`).join('');
  let xlabels='';
  if (pts.length>0) {
    xlabels=`<text x="${px(pts[0].timestamp)}" y="${H-5}" fill="#575f68" font-size="8" font-family="JetBrains Mono" text-anchor="middle">${pts[0].date.slice(5)}</text>`;
    if (pts.length>1) xlabels+=`<text x="${px(pts[pts.length-1].timestamp)}" y="${H-5}" fill="#8d949c" font-size="8" font-family="JetBrains Mono" text-anchor="middle">${pts[pts.length-1].date.slice(5)}</text>`;
    if (pts.length>2) {
      const mid=pts[Math.floor(pts.length/2)];
      xlabels+=`<text x="${px(mid.timestamp)}" y="${H-5}" fill="#575f68" font-size="8" font-family="JetBrains Mono" text-anchor="middle">${mid.date.slice(5)}</text>`;
    }
  }
  svg.innerHTML=`<defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d1512b" stop-opacity="0.28"/><stop offset="100%" stop-color="#d1512b" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    ${area?`<path d="${area}" fill="url(#grad)"/>`:''}
    ${path?`<path d="${path}" stroke="#d1512b" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`:''}
    ${dots}${xlabels}`;
}

function drawBWChart() {
  const svg = document.getElementById('bw-chart');
  if (!svg) return;
  const pts = [...(data.bodyweight||[])].sort((a,b)=>a.date.localeCompare(b.date));
  if (pts.length<2) return;
  const W=400,H=140,padL=36,padR=10,padT=14,padB=22;
  const ys=pts.map(p=>parseFloat(p.weight));
  const minY=Math.min(...ys),maxY=Math.max(...ys);
  const pad=(maxY-minY)*0.2||2;
  const yLo=minY-pad,yHi=maxY+pad,yRange=yHi-yLo;
  const xRange=pts.length-1||1;
  const px=(_,i)=>padL+(i/xRange)*(W-padL-padR);
  const py=v=>padT+(1-(v-yLo)/yRange)*(H-padT-padB);
  let grid='',path='',area='',dots='';
  for(let i=0;i<=3;i++){
    const y=padT+(i/3)*(H-padT-padB);
    grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#222830" stroke-width="1"/>`;
    grid+=`<text x="${padL-4}" y="${y+3}" fill="#575f68" font-size="8" font-family="JetBrains Mono" text-anchor="end">${(yHi-(i/3)*yRange).toFixed(0)}</text>`;
  }
  path=`M ${px(null,0)} ${py(ys[0])}`;
  area=`M ${px(null,0)} ${H-padB}`;
  pts.forEach((p,i)=>{const y=parseFloat(p.weight);if(i>0)path+=` L ${px(null,i)} ${py(y)}`;area+=` L ${px(null,i)} ${py(y)}`;dots+=`<circle cx="${px(null,i)}" cy="${py(y)}" r="3.5" fill="#3f6fa8" stroke="#0b0d0f" stroke-width="2"/>`;});
  area+=` L ${px(null,pts.length-1)} ${H-padB} Z`;
  // trend line
  const n=pts.length;
  const sumX=pts.reduce((_,__,i)=>_+i,0),sumY=ys.reduce((a,b)=>a+b,0);
  const sumXY=pts.reduce((_,__,i)=>_+i*ys[i],0),sumX2=pts.reduce((_,__,i)=>_+i*i,0);
  const slope=(n*sumXY-sumX*sumY)/(n*sumX2-sumX**2)||0;
  const intercept=(sumY-slope*sumX)/n;
  const t0=intercept, t1=slope*(n-1)+intercept;
  const trendLine=`<line x1="${px(null,0)}" y1="${py(t0)}" x2="${px(null,n-1)}" y2="${py(t1)}" stroke="rgba(63,111,168,0.45)" stroke-width="1.5" stroke-dasharray="4,4"/>`;
  svg.innerHTML=`<defs><linearGradient id="bwg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3f6fa8" stop-opacity="0.22"/><stop offset="100%" stop-color="#3f6fa8" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#bwg)"/><path d="${path}" stroke="#3f6fa8" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>${trendLine}${dots}
    <text x="${px(null,0)}" y="${H-5}" fill="#575f68" font-size="8" font-family="JetBrains Mono" text-anchor="middle">${pts[0].date.slice(5)}</text>
    <text x="${px(null,n-1)}" y="${H-5}" fill="#8d949c" font-size="8" font-family="JetBrains Mono" text-anchor="middle">${pts[n-1].date.slice(5)}</text>`;
}

// ═══════════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════════
function bindEvents() {
  // Program switch
  app.querySelectorAll('[data-program]').forEach(b=>b.addEventListener('click',()=>{
    const next = b.dataset.program;
    if ((next !== 'five' && next !== 'six') || next === state.program) return;
    state.program = next;
    try { localStorage.setItem(PROGRAM_KEY, next); } catch {}
    state.selectedDay = null;
    state.selectedExercise = null;
    state.view = 'home';
    render();
  }));
  // Tabs
  app.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
    state.view=b.dataset.tab; state.selectedDay=null; state.selectedExercise=null; render();
  }));
  // Back
  app.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>{
    if (state.view==='log') { state.view='day'; state.selectedExercise=null; logDraft=null; }
    else if (state.view==='day') { state.view='home'; state.selectedDay=null; }
    render();
  }));
  app.querySelectorAll('[data-back-picker]').forEach(b=>b.addEventListener('click',()=>{ state.view='day'; render(); }));
  // Open picker
  const op = app.querySelector('[data-open-picker]');
  if (op) op.addEventListener('click',()=>{ state.view='picker'; render(); });
  // Day select
  app.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{ state.selectedDay=b.dataset.day; state.view='day'; render(); }));
  // Exercise select
  app.querySelectorAll('[data-exercise]').forEach(b=>b.addEventListener('click',()=>{ state.selectedExercise=b.dataset.exercise; state.view='log'; logDraft=null; render(); }));
  // Remove exercise
  app.querySelectorAll('[data-remove-exercise]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const exId=b.dataset.removeExercise, ex=getExerciseById(exId);
    if (confirm(`Remove "${ex?.name||exId}" from ${DAY_NAMES[state.selectedDay]}?\n(History preserved.)`)) { removeExerciseFromDay(state.selectedDay,exId); toast('Removed'); render(); }
  }));
  // Reorder exercises
  app.querySelectorAll('[data-move-up]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); moveExerciseInDay(state.selectedDay, b.dataset.moveUp, -1); render();
  }));
  app.querySelectorAll('[data-move-down]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); moveExerciseInDay(state.selectedDay, b.dataset.moveDown, 1); render();
  }));
  // Toggle picker exercise
  app.querySelectorAll('[data-toggle-exercise]').forEach(b=>b.addEventListener('click',()=>{
    const exId=b.dataset.toggleExercise;
    const active=getDayExercises(state.selectedDay);
    const isActive=active.some(e=>e.id===exId);
    if (isActive) { removeExerciseFromDay(state.selectedDay,exId); toast('Removed'); }
    else { addExerciseToDay(state.selectedDay,exId); toast('Added ✓'); }
    render();
  }));
  // Picker search
  const si = document.getElementById('picker-search-input');
  if (si) si.addEventListener('input',e=>{ state.pickerSearch=e.target.value; render(); setTimeout(()=>{ const el=document.getElementById('picker-search-input'); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},10); });
  // Picker filters
  app.querySelectorAll('[data-pfilter-muscle]').forEach(b=>b.addEventListener('click',()=>{ state.pickerMuscle=b.dataset.pfilterMuscle; render(); }));
  app.querySelectorAll('[data-pfilter-equip]').forEach(b=>b.addEventListener('click',()=>{ state.pickerEquip=b.dataset.pfilterEquip; render(); }));
  // History filter
  app.querySelectorAll('[data-hfilter]').forEach(b=>b.addEventListener('click',()=>{ state.historyFilter=b.dataset.hfilter; render(); }));
  // Delete session
  app.querySelectorAll('[data-delete-session]').forEach(b=>b.addEventListener('click',()=>{
    const ts=parseInt(b.dataset.deleteSession);
    if (confirm('Delete this session?')) { data.sessions=data.sessions.filter(s=>s.timestamp!==ts); save(data); toast('Deleted','danger'); render(); }
  }));
  // Log inputs
  app.querySelectorAll('.set-input').forEach(inp=>inp.addEventListener('input',e=>{
    const i=parseInt(e.target.dataset.set), f=e.target.dataset.field;
    logDraft.sets[i][f]=e.target.value;
    // live 1RM update
    const orm=logDraft.sets.reduce((best,s)=>{const v=calc1RM(s.weight,s.reps);return v&&v>best?v:best;},0);
    const ormEl=app.querySelector('[data-live-orm]');
    if (ormEl) ormEl.textContent=orm?`~${orm} ESTIMATED 1RM`:'';
  }));
  // Remove set
  app.querySelectorAll('[data-remove-set]').forEach(b=>b.addEventListener('click',()=>{ logDraft.sets.splice(parseInt(b.dataset.removeSet),1); render(); }));
  // Add set
  const addSet=app.querySelector('[data-add-set]');
  if (addSet) addSet.addEventListener('click',()=>{ const last=logDraft.sets[logDraft.sets.length-1]||{weight:'',reps:''}; logDraft.sets.push({weight:last.weight,reps:last.reps}); render(); });
  // Notes
  const notes=app.querySelector('[data-notes]');
  if (notes) notes.addEventListener('input',e=>{ logDraft.notes=e.target.value; });
  // Start rest timer
  app.querySelectorAll('[data-start-rest]').forEach(b=>b.addEventListener('click',()=>{ startRest(settings.restDuration); }));
  // Save log
  const saveBtn=app.querySelector('[data-save]');
  if (saveBtn) saveBtn.addEventListener('click',saveLog);
  // Progress chips / metrics
  app.querySelectorAll('[data-chip]').forEach(b=>b.addEventListener('click',()=>{ state.chartExercise=b.dataset.chip; render(); }));
  app.querySelectorAll('[data-metric]').forEach(b=>b.addEventListener('click',()=>{ state.chartMetric=b.dataset.metric; render(); }));
  // Body weight
  const bwSave=document.getElementById('bw-save-btn');
  if (bwSave) bwSave.addEventListener('click',()=>{
    const val=parseFloat(document.getElementById('bw-input').value);
    if (isNaN(val)||val<=0) { toast('Enter a valid weight','warn'); return; }
    if (!data.bodyweight) data.bodyweight=[];
    const today=todayISO();
    data.bodyweight=data.bodyweight.filter(e=>e.date!==today);
    data.bodyweight.push({date:today,weight:val});
    save(data); toast('Weight logged ✓'); render();
    setTimeout(drawBWChart,50);
  });
  app.querySelectorAll('[data-del-bw]').forEach(b=>b.addEventListener('click',()=>{
    data.bodyweight=(data.bodyweight||[]).filter(e=>e.date!==b.dataset.delBw);
    save(data); toast('Removed','danger'); render(); setTimeout(drawBWChart,50);
  }));
  // Settings toggles
  const toggleRest=document.getElementById('toggle-rest');
  if (toggleRest) toggleRest.addEventListener('click',()=>{ settings.restTimer=!settings.restTimer; saveSettings(); toggleRest.classList.toggle('on'); });
  const toggleSound=document.getElementById('toggle-sound');
  if (toggleSound) toggleSound.addEventListener('click',()=>{ settings.soundEnabled=!settings.soundEnabled; saveSettings(); toggleSound.classList.toggle('on'); });
  const restDurInput=document.getElementById('rest-dur-input');
  if (restDurInput) restDurInput.addEventListener('change',e=>{ const v=parseInt(e.target.value); if(v>=15&&v<=300){settings.restDuration=v;saveSettings();toast('Saved');} });
  // Settings data
  const reset=app.querySelector('[data-reset]');
  if (reset) reset.addEventListener('click',()=>{ if(confirm('Erase ALL data? Cannot be undone.')){data={sessions:[],customDays:{},customDaysByProgram:{six:{},five:{}},bodyweight:[],prs:{}};save(data);toast('Erased','danger');render();} });
  const resetCustom=app.querySelector('[data-reset-custom]');
  if (resetCustom) resetCustom.addEventListener('click',()=>{ if(confirm('Reset all routine customizations?')){data.customDaysByProgram={six:{},five:{}};data.customDays={};save(data);toast('Reset');render();} });
  const exp=app.querySelector('[data-export]');
  if (exp) exp.addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`liftlog-${todayISO()}.json`;a.click();URL.revokeObjectURL(url);
  });
  const imp=app.querySelector('[data-import]');
  if (imp) imp.addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try {
        const parsed=JSON.parse(ev.target.result);
        if (!parsed.sessions||!Array.isArray(parsed.sessions)) throw new Error('Invalid');
        if (!parsed.customDays) parsed.customDays={};
        if (!parsed.customDaysByProgram) parsed.customDaysByProgram={six: JSON.parse(JSON.stringify(parsed.customDays)), five:{}};
        if (!parsed.bodyweight) parsed.bodyweight=[];
        if (!parsed.prs) parsed.prs={};
        if (confirm(`Import ${parsed.sessions.length} session(s)? Replaces current data.`)){data=parsed;save(data);toast('Imported ✓');render();}
      } catch(err){alert('Invalid file: '+err.message);}
    };
    reader.readAsText(f);
  });
  // Draw BW chart after render
  if (state.view==='bodyweight') setTimeout(drawBWChart,50);
}

function saveLog() {
  const sets=logDraft.sets.filter(s=>s.weight||s.reps);
  if (!sets.length) { toast('Enter at least one set','warn'); return; }
  const today=todayISO();
  let session=data.sessions.find(s=>s.date===today&&s.day===state.selectedDay);
  if (!session) { session={date:today,day:state.selectedDay,timestamp:Date.now(),exercises:[],notes:''}; data.sessions.push(session); }
  session.exercises=session.exercises.filter(e=>e.exerciseId!==state.selectedExercise);
  session.exercises.push({exerciseId:state.selectedExercise,sets});
  if (logDraft.notes) session.notes=(session.notes?session.notes+' · ':'')+logDraft.notes;
  // Check PR
  const newPR=checkForNewPR(state.selectedExercise,sets);
  save(data);
  toast('Saved ✓');
  if (newPR) setTimeout(()=>prFlash(newPR),400);
  if (settings.restTimer) setTimeout(()=>startRest(settings.restDuration),600);
  state.view='day'; state.selectedExercise=null; logDraft=null; render();
}

render();
</script>
</body>
</html>
